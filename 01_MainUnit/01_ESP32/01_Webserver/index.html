<!doctype html>

   <head>

      <script type = "text/javascript">
          var ws = null;
          ws = new WebSocket("ws://192.168.4.1/ws");
          ws.onopen = function() {
            document.getElementById("buttonMeasure").disabled = false;
            document.getElementById("buttonTime").disabled = false;
            document.getElementById("buttonClampsOnly").disabled = false;
            document.getElementById("buttonPlus").disabled = false;
            document.getElementById("buttonMinus").disabled = false;
            document.getElementById("status").innerHTML= "connection ok";
          };
          ws.onclose = function() {
            document.getElementById("buttonMeasure").disabled = true;
            document.getElementById("buttonTime").disabled = true;
            document.getElementById("buttonClampsOnly").disabled = true;
            document.getElementById("buttonPlus").disabled = true;
            document.getElementById("buttonMinus").disabled = true;
            document.getElementById("status").innerHTML= "connection LOST";
            alert("Connection lost");
          };
          ws.onmessage = function(event){
          	var gauges = ["gauge1","gauge2","gauge3","gauge4","gauge5","gauge6","gauge7","gauge8","gauge9","gauge10"];
            var clamps = ["clamp_1","clamp_2","clamp_3","clamp_4","clamp_5","clamp_6","clamp_7","clamp_8","clamp_9","clamp_0"];
            var fields = clamps.concat(["irr_1","irr_2","tmod_1","tmod_2","volt_1"]);
            if (event.data.startsWith("SAVED")) {
              document.getElementById("status").innerHTML= "data saved!";
            }
            else if (event.data.startsWith("DATA")) {
              document.getElementById("tableData").innerHTML += event.data.substring(4);
            }
            else {
              document.getElementById("status").innerHTML= " ";
              document.getElementById("buttonSave").disabled = false;
              document.getElementById("buttonClampsOnly").disabled = false;
              for(var i=0; i < fields.length; i++) {
                document.getElementById(fields[i]).innerHTML = "";
                document.getElementById(fields[i]).style.backgroundColor = "#fafafa";
              }
              for(var i=0; i < gauges.length; i++) {
                document.getElementById(gauges[i]).innerHTML = "";
                document.getElementById(gauges[i]).style.backgroundColor = "#fafafa";
              }
              var strElements = event.data.split('|');
              for(var i = 0; i < strElements.length; i++) {
                var strValue = strElements[i].split(';');
                if (strValue.length > 1) {
                  if (strValue[0] == "string") { document.getElementById("string").value = strValue[1]; }
                  else {
                    if ((strValue[0].startsWith("irr")) || (strValue[0].startsWith("volt"))) {
                      document.getElementById(strValue[0]).innerHTML = strValue[1].split('.')[0]; 
                    } 
                    else if (strValue[0].startsWith("clamp")) {
                      document.getElementById(strValue[0]).innerHTML = Math.round(parseFloat(strValue[1])*1000)/1000;
                    }
                    else {
                  	  document.getElementById(strValue[0]).innerHTML = strValue[1]; 
                    }
                  }
                }
              }
              var results = [];
              for(var i = 0; i < clamps.length; i++) {
              	if (document.getElementById(clamps[i]).innerHTML == "") {
              		results.push(0);
              	}
              	else{ 
              		results.push(parseFloat(document.getElementById(clamps[i]).innerHTML));
              	}
              }
              var resultAvg = 0, j = 0;
              for (i = 0; i < results.length; i++) {
                if (results[i] > 0) {
                  resultAvg += results[i];
                  j++;
                }
              }
              if (j>0) { resultAvg /= j; }
              for (i = 0; i < results.length; i++) {
                if ((results[i] > 0) && (results[i] > 0.9 * resultAvg ) && (results[i] < 1.1 * resultAvg) ) {
                  document.getElementById(clamps[i]).style.backgroundColor = "#fafafa";
                }
                else {
                  document.getElementById(clamps[i]).style.backgroundColor = "yellow";
                }
              }
              var irr = parseFloat(document.getElementById("irr_1").innerHTML);
              var irr2 = parseFloat(document.getElementById("irr_2").innerHTML);
              if (irr > 650 && irr2 > 650 ) {
                if (irr < 0.95 * irr2 || irr > 1.05 * irr2) {
                  document.getElementById("irr_1").style.backgroundColor = "yellow";
                  document.getElementById("irr_2").style.backgroundColor = "yellow";
                }
                else {
                  document.getElementById("irr_1").style.backgroundColor = "#fafafa";
                  document.getElementById("irr_2").style.backgroundColor = "#fafafa";
                }
              }
              else {
              	if (!(irr > 650)) { document.getElementById("irr_1").style.backgroundColor = "red"; }
              	if (!(irr2 > 650)) { document.getElementById("irr_2").style.backgroundColor = "red"; }
              }
              if ((irr < 650) || (isNaN(irr))) {parseFloat(document.getElementById("irr_2").innerHTML); }
              var tmod = parseFloat(document.getElementById("tmod_1").innerHTML);
              if ((tmod == 0) || (isNaN(tmod))) {parseFloat(document.getElementById("tmod_2").innerHTML); }
              var tk = parseFloat(document.getElementById("valueTk").value);
              var volt = parseFloat(document.getElementById("volt_1").innerHTML);
              var modules = parseFloat(document.getElementById("valueModules").value);
              var pnom = parseFloat(document.getElementById("valuePnom").value);
              for(var i = 0; i < results.length; i++) {
              	if (irr > 0) { results[i] = results[i] * volt / irr * 1000.0 * (1 - (tmod - 25.0) * tk / 100.0)/(pnom*modules)*100.0;
              	}
              	else { results[i] = 0; }
              	document.getElementById(gauges[i]).innerHTML = results[i];
              	if (results[i] < 70) { document.getElementById(gauges[i]).style.backgroundColor =  "#ef4655";}
              	else if (results[i] < 80) { document.getElementById(gauges[i]).style.backgroundColor =  "#f7aa38";}
              	else if (results[i] < 90) { document.getElementById(gauges[i]).style.backgroundColor =  "#fffa50";}
              	else if (results[i] < 110) { document.getElementById(gauges[i]).style.backgroundColor =  "#5ee432";}
              	else { document.getElementById(gauges[i]).style.backgroundColor =  "#BE80FF";}
              	document.getElementById(gauges[i]).innerHTML = results[i].toFixed(1);
              }
              document.getElementById("buttonMeasure").disabled = false;
              document.getElementById("status").innerHTML= "done";
            }
          };
         function ChangeClamps(plusMinus) {
           var i;
           var gauges = ["gauge1","gauge2","gauge3","gauge4","gauge5","gauge6","gauge7","gauge8","gauge9","gauge10"];
           var clamps = ["clamp_1","clamp_2","clamp_3","clamp_4","clamp_5","clamp_6","clamp_7","clamp_8","clamp_9","clamp_0"];
           var clampsTitles = ["clamp_1_title","clamp_2_title","clamp_3_title","clamp_4_title","clamp_5_title","clamp_6_title","clamp_7_title","clamp_8_title","clamp_9_title","clamp_0_title"];
           for (i = 1; i < 10; i++) {
              if ((document.getElementById(clamps[i]).hidden) && !(plusMinus)) {
              	document.getElementById(gauges[i]).hidden = false;
              	document.getElementById(clamps[i]).hidden = false;
              	document.getElementById(clampsTitles[i]).hidden = false;
              	if (i>4) {
              		document.getElementById("buttonMoreClamps").style = "padding-top: 88px; padding-bottom: 88px; ";
              		document.getElementById("buttonLessClamps").style = "padding-top: 88px; padding-bottom: 88px; ";
              	}
              	i=10;
              }
              else if ((document.getElementById(clamps[i]).hidden) && (plusMinus) &&  (i>1)) {
              	document.getElementById(gauges[i-1]).hidden = true;
              	document.getElementById(clamps[i-1]).hidden = true;
              	document.getElementById(clampsTitles[i-1]).hidden = true;
              	if (i<7) {
              		document.getElementById("buttonMoreClamps").style = "padding-top: 36px; padding-bottom: 36px; ";
              		document.getElementById("buttonLessClamps").style = "padding-top: 36px; padding-bottom: 36px; ";
              	}
              	i=10;
              }
              else if ((i==9) && (plusMinus))  {
              	document.getElementById(gauges[i]).hidden = true;
              	document.getElementById(clamps[i]).hidden = true;
              	document.getElementById(clampsTitles[i]).hidden = true;
              }
            }
         };
         function SendMeasure(){
          var j = 0;
          var clamps = ["clamp_1","clamp_2","clamp_3","clamp_4","clamp_5","clamp_6","clamp_7","clamp_8","clamp_9","clamp_0"];
          for (var i = 0; i < 10; i++) {
            if (document.getElementById(clamps[i]).hidden == false) { j=i;}
          }
          j++; if (j==10) {j=0;}
          document.getElementById("status").innerHTML= "measurement started... ("+j+" clamps)";
          ws.send("MEASURE_"+j+";"+document.getElementById("string").value);
         };
         function SendClampsOnly(){
          var j = 0;
          var clamps = ["clamp_1","clamp_2","clamp_3","clamp_4","clamp_5","clamp_6","clamp_7","clamp_8","clamp_9","clamp_0"];
          for (var i = 0; i < 10; i++) {
            if (document.getElementById(clamps[i]).hidden == false) { j=i;}
          }
          j++; if (j==10) {j=0;}
          document.getElementById("status").innerHTML= "clamp test... ("+j+ " clamps)";
          ws.send("CLAMPS_"+j+";"+document.getElementById("string").value);
         }; 
         function SendSave(){
          document.getElementById("status").innerHTML= "..saving..";
          ws.send("SAVE"+";"+document.getElementById("string").value);
          document.getElementById("buttonSave").disabled = true;
         } 
         function SendTime(){
          var dt = new Date();
          var timeString = dt.toLocaleString("de-de",{day:"2-digit",month:"2-digit",year:"2-digit"}) + " " + dt.toLocaleString("de-de",{hour:"2-digit",minute:"2-digit"});
          document.getElementById("time").innerHTML = timeString;
          document.getElementById("status").innerHTML= "time set, sent to device";
          ws.send("TIME"+";"+ timeString + ";");
         }

          function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
              tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
              tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
            if (tabName == "tabData") {
              document.getElementById("tableData").innerHTML= "";  
              ws.send("DATA");
            }
          } 
          
          function ChangeString(plusMinus) {
            var inString = document.getElementById("string").value;
            var lastDigits;
            if (!isNaN(inString.substr(inString.length-2))) {
              lastDigits = inString.substr(inString.length-2);
              inString = inString.substr(0,inString.length-2);
              if (plusMinus) { 
                lastDigits = ('0'+(parseInt(lastDigits)+1).toString()).slice(-2); //always 2 digits
              }
              else if (parseInt(lastDigits) > 0) {
              	lastDigits = ('0'+(parseInt(lastDigits)-1).toString()).slice(-2); //always 2 digits
              }
              inString += lastDigits;
            }
            else if (!isNaN(inString.substr(inString.length-1))) {
              lastDigits = inString.substr(inString.length-1);
              inString = inString.substr(0,inString.length-1); 
              if (plusMinus) { 
                lastDigits = ((parseInt(lastDigits)+1).toString()); 
              }
              else if (parseInt(lastDigits) > 0) {
                lastDigits = ((parseInt(lastDigits)-1).toString()).slice(-1); //always 1 digit
              }
              inString += lastDigits;
            }
            document.getElementById("string").value = inString;
          }

          function SaveData() {
            var textToSave = document.getElementById("tableData").innerHTML;
            var a = window.document.createElement('a');
            a.href = window.URL.createObjectURL(new Blob([textToSave], {type: 'text/plain'}));
            a.download = 'AA_Log.txt';
            document.body.appendChild(a)
            a.click();
            document.body.removeChild(a)
          }
 
      </script>
